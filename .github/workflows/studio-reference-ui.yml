name: Studio reference visual QA

on:
  pull_request:
    branches:
      - fix/bus-resample-routing-preflight-20261101
      - feat/reproductor-instrumentos-reales
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install application and visual test dependencies
        run: |
          npm ci
          npm ci --prefix app
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Spec inventory and acceptance structural integrity
        run: |
          node scripts/audit-beatmaker-requirements.mjs
          node scripts/verify-beatmaker-acceptance.mjs --check
          node --test tests/unit/beatmaker-acceptance-gate.test.mjs
      - name: Focused unit regressions for new Studio capabilities
        run: |
          node --test tests/unit/automation-edit.test.mjs tests/unit/automation-midi.test.mjs tests/unit/arrangement-model.test.mjs tests/unit/instrument-catalog.test.ts tests/project-sample-voice.test.mjs
      - name: TypeScript and production bundle
        run: |
          cd app
          npx tsc -b
          npx vite build
      - name: Production dist audit
        run: node scripts/audit-studio-dist.mjs
      - name: Lint all source files touched by reference Studio
        run: |
          cd app
          npx eslint src/PianoApp.tsx src/components/studio/ReferenceStudio.tsx src/components/studio/InstrumentBrowser.tsx src/components/studio/StudioScore.tsx src/components/studio/studioMacros.ts src/components/studio/studioMusicalBars.ts src/components/studio/referenceArrangementActions.ts src/components/tracks/ProjectMixer.tsx src/components/tracks/ProjectSampleVoicePanel.tsx src/components/beatmaker/AutomationEditor.tsx src/components/beatmaker/Arrangement.tsx src/audio/liveStudioEngine.ts src/audio/projectPlayback.ts src/audio/projectAudioSink.ts src/audio/projectEffects.ts src/audio/monoUserSampleEngine.ts src/audio/renderProjectPcm.ts src/audio/offlineRenderRealm.ts src/project/commands.ts src/project/model.ts src/project/validate.ts src/project/automationParameters.ts src/project/midiRecordingTarget.ts src/composition/automationEdit.ts src/composition/automationCurve.ts src/composition/automationCanvas.ts src/composition/arrangementModel.ts src/midi/automationMidi.ts src/instruments/catalog.ts src/instruments/projectCatalog.ts src/sequencer/timelineEvents.ts src/sequencer/automationResolver.ts src/sequencer/transportScheduler.ts
      - name: Verify reference geometry and interactions
        run: |
          npx playwright test tests/e2e/studio-reference-ui.spec.ts tests/e2e/sequencer-transport.spec.ts tests/e2e/project-mixer-sends.spec.ts tests/e2e/project-mixer-effects-ui.spec.ts tests/e2e/project-sidechain.spec.ts tests/e2e/project-automation-audio.spec.ts tests/e2e/project-studio-automation-flow.spec.ts tests/e2e/mono-user-sample.spec.ts tests/e2e/project-studio-sample-voice.spec.ts --workers=1 --retries=0
        env:
          CI: 'true'
      - name: Preserve screenshot evidence, traces and debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-reference-visual-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
