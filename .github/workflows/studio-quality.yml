name: Beatmaker Studio quality gates

on:
  pull_request:
    branches:
      - feat/reproductor-instrumentos-reales
      - master
  push:
    branches:
      - feat/reproductor-instrumentos-reales
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-build:
    name: TypeScript, ESLint, build and audio asset audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        run: |
          mkdir -p .logs
          set -o pipefail
          npm ci --prefix app 2>&1 | tee .logs/ci-install.log
      - name: Run all static checks and retain exact failure output
        run: |
          mkdir -p .logs
          result=0
          node scripts/audit-beatmaker-requirements.mjs > .logs/ci-requirements.log 2>&1 || result=1
          node scripts/verify-beatmaker-acceptance.mjs --check > .logs/ci-acceptance-structure.log 2>&1 || result=1
          node --test tests/unit/smk37-capture.test.mjs > .logs/ci-midi-gate.log 2>&1 || result=1
          (cd app && timeout 180s npx tsc -b) > .logs/ci-typescript.log 2>&1 || result=1
          (cd app && timeout 120s npx eslint .) > .logs/ci-eslint.log 2>&1 || result=1
          (cd app && timeout 300s npx vite build) > .logs/ci-build.log 2>&1 || result=1
          node scripts/audit-studio-dist.mjs > .logs/ci-dist.log 2>&1 || result=1
          for report in .logs/ci-*.log; do
            echo "--- $report ---"
            tail -n 70 "$report"
          done
          exit "$result"
      - name: Upload exact static diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-static-diagnostics
          path: .logs/ci-*.log
          if-no-files-found: ignore
          retention-days: 7

  focal-browser:
    name: Studio core and bus resampling browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install test and app dependencies
        run: |
          npm ci
          npm ci --prefix app
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run bounded core tests
        run: |
          mkdir -p .logs
          set -o pipefail
          timeout 720s npx playwright test \
            tests/e2e/project-bus-routing-preflight.spec.ts \
            tests/e2e/project-bus-resample.spec.ts \
            tests/e2e/project-studio-bus-resample.spec.ts \
            tests/e2e/project-mixer-sends.spec.ts \
            tests/e2e/project-four-bar-flow.spec.ts \
            tests/e2e/project-bundle-preview.spec.ts \
            tests/e2e/audio-live-voice.spec.ts \
            --workers=1 --retries=0 2>&1 | tee .logs/ci-playwright.log
        env:
          CI: 'true'
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-playwright-failures
          path: |
            test-results
            .logs/ci-playwright.log
          if-no-files-found: ignore
          retention-days: 7
